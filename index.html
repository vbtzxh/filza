<title>Filza</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:17px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;overflow:hidden}
#app{height:100%;position:relative;overflow:hidden}
#top{position:absolute;top:0;left:0;right:0;z-index:3;padding-top:env(safe-area-inset-top,0px);background:var(--bar);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border-bottom:.5px solid var(--line)}
header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;flex:none}
header .t{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header{position:relative}
.nb{color:var(--blue);background:none;border:0;font:inherit;padding:8px;display:flex;align-items:center;gap:2px;max-width:30%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.nb:active{opacity:.4}.nb[hidden]{visibility:hidden}
#crumbs{display:flex;overflow-x:auto;gap:4px;padding:8px 12px;flex:none;scrollbar-width:none}
#crumbs::-webkit-scrollbar{display:none}
#crumbs span{flex:none;font-size:13px;color:var(--blue);padding:3px 9px;border-radius:12px;background:rgba(0,122,255,.1);cursor:pointer}
#crumbs span:last-child{color:var(--tx);background:rgba(128,128,128,.16);font-weight:500}
#sw{padding:8px 12px 4px;flex:none;display:none}
#sw.on{display:block}
#q{width:100%;border:0;border-radius:10px;background:rgba(128,128,128,.16);color:var(--tx);font:16px inherit;padding:8px 12px;outline:0;-webkit-user-select:text;user-select:text}
#list{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--pt,100px);padding-bottom:var(--pb,80px)}
.row{display:flex;align-items:center;gap:12px;padding:0 0 0 14px;height:62px;cursor:pointer;position:relative}
.row{transition:background .15s,transform .15s}
.row:active,.row.sel{background:var(--sel)}
.row:active{transform:scale(.985)}
.row.out{animation:out .32s ease forwards;overflow:hidden}
.ck{width:0;height:22px;margin-right:-12px;border-radius:50%;border:0 solid var(--sub);flex:none;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.3);transition:width .32s cubic-bezier(.2,.9,.3,1),margin .32s,opacity .25s,transform .32s cubic-bezier(.2,.9,.3,1.3)}
.edit .ck{width:22px;margin-right:0;border-width:1.5px;opacity:1;transform:none}
.sel .ck{background:var(--blue);border-color:var(--blue);animation:pop .3s}
.sel .ck:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ic{width:38px;height:38px;flex:none}
.mid{flex:1;min-width:0;height:100%;display:flex;align-items:center;border-bottom:.5px solid var(--line)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm i{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{font-size:14px;color:var(--sub);padding-right:6px;flex:none}
.chev{width:8px;height:14px;margin:0 14px 0 4px;flex:none;stroke:var(--line);stroke-width:2;fill:none}
.edit .chev{display:none}
.empty{text-align:center;color:var(--sub);padding:80px 20px;font-size:15px}
footer{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--bar);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
footer button{background:none;border:0;color:var(--blue);display:flex;flex-direction:column;align-items:center;gap:2px;font:10px inherit;min-width:58px;cursor:pointer}
footer button{transition:transform .15s,opacity .15s}
footer button:active{opacity:.45;transform:scale(.86)}
.nb{transition:opacity .15s,transform .15s}
footer button:disabled{color:var(--sub);opacity:.5}
footer svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#sheet.on{display:flex;animation:fade .25s}
#sheet.on .box{animation:up .4s cubic-bezier(.2,.9,.25,1)}
#sheet .box{width:100%;display:flex;flex-direction:column;gap:8px}
#sheet .g{background:var(--bar);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;overflow:hidden}
#sheet .g div{padding:16px;text-align:center;color:var(--blue);font-size:19px;border-top:.5px solid var(--line);cursor:pointer}
#sheet .g div:first-child{border-top:0}
#sheet .g div.h{color:var(--sub);font-size:13px;cursor:default;padding:12px}
#sheet .g div.cur{font-weight:600}
#sheet .g div:active:not(.h){background:rgba(128,128,128,.2)}
#sheet .c div{font-weight:600}
#view{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:4;padding-top:env(safe-area-inset-top,0px)}
#view.on{display:flex;animation:sin .4s cubic-bezier(.2,.8,.2,1)}
#view header{background:var(--bar);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border-bottom:.5px solid var(--line)}
#view pre{flex:1;margin:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));overflow:auto;font:12.5px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
@keyframes pf{from{transform:translateX(26%);opacity:0}to{transform:none;opacity:1}}
@keyframes pb{from{transform:translateX(-26%);opacity:0}to{transform:none;opacity:1}}
@keyframes rin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(110%)}to{transform:none}}
@keyframes sin{from{transform:translateX(100%)}to{transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes out{to{opacity:0;transform:translateX(-70px) scale(.96);height:0}}
@keyframes tt{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translateX(-50%)}}
#list.pf{animation:pf .42s cubic-bezier(.2,.8,.2,1)}
#list.pb{animation:pb .42s cubic-bezier(.2,.8,.2,1)}
#list.pf .row,#list.pb .row,#list.pn .row{animation:rin .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*24ms)}
#title.t2{animation:tt .35s cubic-bezier(.2,.8,.2,1)}
#crumbs span{transition:transform .15s,background .2s}#crumbs span:active{transform:scale(.92)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(60,60,67,.92);color:#fff;font-size:14px;padding:9px 16px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
</style>
